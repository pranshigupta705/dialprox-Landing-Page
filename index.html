
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#4F46E5" />
    <meta
      name="description"
      content="DialProx handles inbound and outbound calls with AI voice agents, then hands the hard ones to your team with the full conversation attached."
    />
    <title>DialProx – Voice support that scales</title>
    <script>
      // Apply the saved theme before React loads to avoid a light-to-dark flash.
      (function () {
        try {
          var saved = localStorage.getItem('dialprox-theme');
          var dark =
            saved === 'dark' ||
            (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
